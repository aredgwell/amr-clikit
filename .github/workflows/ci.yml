name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gate (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov=amr_clikit --cov-report=term-missing
      - run: uv build

  actions:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: raven-actions/actionlint@v2

  # Dependabot's patch and minor updates merge themselves once every other job
  # here has passed. A major, or a release whose maintainers changed, waits for
  # a person: those are the updates that need a decision rather than a glance.
  # The 7-day cooldown in `dependabot.yml` is what keeps a freshly published,
  # possibly compromised release from arriving this way at all.
  #
  # Merged with the workflow token because these repositories cannot carry
  # branch protection, so there is no required check for `--auto` to wait on —
  # `needs` is that wait. A token-made merge does not trigger `push`, so `main`'s
  # own run is dispatched explicitly; without it the merged commit has no record.
  automerge:
    name: dependabot auto-merge
    needs: [check, actions]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      - name: merge, then run the gate on main
        if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.metadata.outputs.maintainer-changes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # The commit `needs` vouched for. Dependabot can push a rebase after
          # the checks pass; without this the newer, unchecked head would merge.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_URL" --merge --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
