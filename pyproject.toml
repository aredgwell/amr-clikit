[project]
name = "amr-clikit"
version = "0.1.0"
description = "Shared CLI toolkit: structured logging and stdout/stderr discipline for Python CLIs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Redgwell", email = "andrew@amr.nz" }]
keywords = ["cli", "logging", "structlog", "stdout", "stderr", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "structlog>=24.1",
]

[project.urls]
Homepage = "https://github.com/aredgwell/amr-clikit"
Repository = "https://github.com/aredgwell/amr-clikit"
Issues = "https://github.com/aredgwell/amr-clikit/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amr_clikit"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
